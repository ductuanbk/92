<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giỏ hàng Á Đông Land</title>
<style>
  :root {
    --brand: #a31d24; --brand-dark: #7c151b; --brand-soft: #fbecec;
    --ink: #1d1f23; --muted: #646a73; --line: #e3e5e8; --bg: #f5f6f7; --card: #ffffff;
    --ok: #1d7a46; --ok-bg: #e5f4ea; --warn: #9a6400; --warn-bg: #fdf2dc;
    --lock: #3753a6; --lock-bg: #e8edfb; --sold: #6b6f76; --sold-bg: #eceef0;
    --dep: #7a3fa0; --dep-bg: #f3e9f9;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }

  header { background: var(--brand); color: #fff; }
  .bar { max-width: 1400px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { font-weight: 700; letter-spacing: .3px; }
  .logo small { display: block; font-weight: 400; opacity: .8; font-size: 12px; }
  .projects { display: flex; gap: 6px; flex-wrap: wrap; }
  .projects button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .projects button.on { background: #fff; color: var(--brand); border-color: #fff; font-weight: 600; }
  .spacer { flex: 1; }
  .hbtn { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .hbtn.admin { background: #fff; color: var(--brand); font-weight: 600; }

  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .demo { background: var(--warn-bg); color: var(--warn); border: 1px solid #f0d9a6; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
  .err { background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #f0c6c8; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .tabs button { background: none; border: none; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; text-align: left; }
  .kpi.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }

  .filters { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid;
    grid-template-columns: 2fr repeat(5, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .filters input, .filters select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 0; }
  .price-range { display: flex; gap: 4px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; color: var(--muted); }
  .btn { background: #fff; border: 1px solid var(--line); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: #c9ccd1; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .5; cursor: default; }

  .tablewrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 330px); min-height: 300px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: #fafafb; font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafafa; }
  tbody tr.sold td { color: var(--muted); }
  td.code { font-weight: 600; }
  .note-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .s-ok { background: var(--ok-bg); color: var(--ok); }
  .s-check { background: var(--warn-bg); color: var(--warn); }
  .s-lock { background: var(--lock-bg); color: var(--lock); }
  .s-dep { background: var(--dep-bg); color: var(--dep); }
  .s-sold { background: var(--sold-bg); color: var(--sold); }
  .src { font-size: 11px; color: var(--muted); }

  .cards { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .code { font-weight: 700; font-size: 16px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card .price { font-weight: 700; margin-top: 6px; }

  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: #fff; z-index: 21; transform: translateX(100%);
    transition: transform .2s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer-bg.open { display: block; }
  .drawer .dh { padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: start; gap: 10px; }
  .drawer .dh h2 { margin: 0; font-size: 20px; }
  .drawer .db { padding: 16px; overflow: auto; flex: 1; }
  .drawer .close { margin-left: auto; background: none; border: none; font-size: 24px; cursor: pointer; line-height: 1; color: var(--muted); }
  dl.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0 0 16px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; word-break: break-word; }
  .section-title { font-weight: 700; margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .4px; }
  .editbox { background: var(--brand-soft); border: 1px solid #f0c6c8; border-radius: var(--radius); padding: 12px; }
  .editbox label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  .editbox select, .editbox input, .editbox textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: min(380px, 100%); }
  .modal h3 { margin: 0 0 12px; }
  .modal input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }

  .ref table td, .ref table th { white-space: normal; min-width: 90px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px;
    border-radius: 8px; z-index: 40; display: none; max-width: calc(100% - 32px); }
  .toast.show { display: block; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { max-width: 1400px; margin: 0 auto; padding: 8px 16px 24px; color: var(--muted); font-size: 12px; }
  .loading { opacity: .5; pointer-events: none; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .kpi { padding: 8px 10px; }
    .kpi .v { font-size: 18px; }
    .kpis > div.kpi { grid-column: 1 / -1; }
    .filters { grid-template-columns: 1fr 1fr; }
    .filters .search { grid-column: 1 / -1; }
    .tablewrap { display: none; }
    .cards { display: block; }
    dl.kv { grid-template-columns: 120px 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Á ĐÔNG LAND<small>Quản lý giỏ hàng dự án</small></div>
    <div class="projects" id="projects"></div>
    <div class="spacer"></div>
    <button class="hbtn" id="adminBtn">Đăng nhập admin</button>
  </div>
</header>

<main>
  <div id="banner"></div>
  <div class="tabs" id="tabs">
    <button data-tab="units" class="on">Giỏ hàng</button>
    <button data-tab="refs">Thông tin cọc &amp; tham khảo</button>
    <button data-tab="log">Nhật ký cập nhật</button>
  </div>

  <section id="tab-units">
    <div class="kpis" id="kpis"></div>
    <div class="filters">
      <input class="search" id="q" placeholder="Tìm mã căn, đường, ghi chú, đối tác...">
      <select id="fSource"></select>
      <select id="fZone"></select>
      <select id="fType"></select>
      <select id="fHandover"></select>
      <div class="price-range">
        <input id="fMin" type="number" min="0" step="0.5" placeholder="Giá từ (tỷ)">
        <input id="fMax" type="number" min="0" step="0.5" placeholder="đến">
      </div>
    </div>
    <div class="toolbar">
      <span id="count"></span>
      <span class="spacer"></span>
      <span id="updated"></span>
      <button class="btn" id="exportBtn">Xuất CSV</button>
      <button class="btn" id="reloadBtn">Tải lại</button>
      <a class="btn" id="sheetLink" target="_blank" rel="noopener">Mở Google Sheet</a>
    </div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="cards" id="cards"></div>
  </section>

  <section id="tab-refs" hidden>
    <div class="toolbar" id="refButtons"></div>
    <div class="ref tablewrap" id="refBody"><div class="empty">Chọn một bảng để xem.</div></div>
  </section>

  <section id="tab-log" hidden>
    <div class="tablewrap" id="logBody"><div class="empty">Đang tải...</div></div>
  </section>
</main>
<footer id="footer"></footer>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><div><h2 id="dTitle"></h2><div id="dSub" class="src"></div></div><button class="close" id="dClose" aria-label="Đóng">×</button></div>
  <div class="db" id="dBody"></div>
</aside>

<div class="modal-bg" id="loginModal">
  <div class="modal">
    <h3>Đăng nhập admin</h3>
    <input id="loginName" placeholder="Tên người cập nhật (ghi vào nhật ký)">
    <input id="loginPin" type="password" inputmode="numeric" placeholder="Mã PIN">
    <div class="actions"><button class="btn primary" id="loginOk">Đăng nhập</button><button class="btn" id="loginCancel">Hủy</button></div>
    <div id="loginMsg" class="src"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ─────────── Kết nối máy chủ (Apps Script) hoặc dữ liệu mẫu ───────────
  var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  var DEMO_BANNER = HAS_GAS ? '' : '<div class="demo">Đang xem <b>dữ liệu mẫu</b>. Khi triển khai trên Google Apps Script, app sẽ đọc trực tiếp từ Google Sheet giỏ hàng.</div>';

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!HAS_GAS) return Promise.resolve().then(function () { return Mock[fn].apply(null, args); });
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
      r[fn].apply(r, args);
    });
  }

  // ─────────── Trạng thái ───────────
  var ST = { AVAILABLE: 'Còn hàng', CHECK: 'Check admin', LOCKED: 'Đang lock', DEPOSITED: 'Đã cọc', SOLD: 'Đã bán' };
  var ST_ORDER = [ST.AVAILABLE, ST.CHECK, ST.LOCKED, ST.DEPOSITED, ST.SOLD];
  var ST_CLASS = {}; ST_CLASS[ST.AVAILABLE] = 's-ok'; ST_CLASS[ST.CHECK] = 's-check'; ST_CLASS[ST.LOCKED] = 's-lock';
  ST_CLASS[ST.DEPOSITED] = 's-dep'; ST_CLASS[ST.SOLD] = 's-sold';

  var state = {
    boot: null, project: null, data: null, units: [],
    filter: { q: '', source: '', zone: '', type: '', handover: '', status: '', min: '', max: '' },
    sort: { key: 'status', dir: 1 },
    admin: loadAdmin(), current: null, tab: 'units'
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, ms || 2600); }
  function errMsg(e) { return (e && (e.message || e)) + ''; }

  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function loadAdmin() { try { var s = store('adl_admin'); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

  function ty(n) { if (n == null || n === '') return '—'; return (n / 1e9).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' tỷ'; }
  function vnd(n) { if (n == null || n === '') return '—'; return Math.round(n).toLocaleString('vi-VN') + ' đ'; }
  function m2(n) { if (n == null || n === '') return '—'; return n.toLocaleString('vi-VN', { maximumFractionDigits: 1 }); }
  function chip(s) { return '<span class="chip ' + (ST_CLASS[s] || 's-check') + '">' + esc(s || '—') + '</span>'; }
  function natural(a, b) { return String(a).localeCompare(String(b), 'vi', { numeric: true, sensitivity: 'base' }); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase(); }

  // ─────────── Khởi động ───────────
  call('apiBootstrap').then(function (boot) {
    state.boot = boot;
    $('banner').innerHTML = DEMO_BANNER;
    $('footer').textContent = boot.companyName + ' · Hotline ' + boot.hotline;
    $('projects').innerHTML = boot.projects.map(function (p) { return '<button data-p="' + esc(p.id) + '">' + esc(p.name) + '</button>'; }).join('');
    $('projects').onclick = function (e) { var b = e.target.closest('button'); if (b) selectProject(b.dataset.p); };
    renderAdminBtn();
    var saved = store('adl_project');
    selectProject(boot.projects.some(function (p) { return p.id === saved; }) ? saved : boot.projects[0].id);
  }).catch(function (e) { $('banner').innerHTML = '<div class="err">Không khởi động được: ' + esc(errMsg(e)) + '</div>'; });

  function selectProject(id) {
    state.project = state.boot.projects.filter(function (p) { return p.id === id; })[0];
    store('adl_project', id);
    Array.prototype.forEach.call($('projects').children, function (b) { b.classList.toggle('on', b.dataset.p === id); });
    $('sheetLink').href = state.project.sheetUrl;
    state.filter = { q: '', source: '', zone: '', type: '', handover: '', status: '', min: '', max: '' };
    $('q').value = ''; $('fMin').value = ''; $('fMax').value = '';
    renderRefButtons();
    load(false);
    if (state.tab === 'log') loadLog();
  }

  function load(force) {
    document.body.classList.add('loading');
    return call('apiGetInventory', state.project.id, !!force).then(function (data) {
      if (data.projectId !== state.project.id) return;
      state.data = data;
      state.units = data.units;
      var errs = data.sources.filter(function (s) { return s.error; });
      $('banner').innerHTML = DEMO_BANNER +
        errs.map(function (s) { return '<div class="err">' + esc(s.label) + ': ' + esc(s.error) + '</div>'; }).join('');
      $('updated').textContent = 'Cập nhật lúc ' + new Date(data.updatedAt).toLocaleTimeString('vi-VN');
      buildFilterOptions();
      render();
    }).catch(function (e) { toast('Lỗi tải dữ liệu: ' + errMsg(e), 5000); })
      .then(function () { document.body.classList.remove('loading'); });
  }

  // ─────────── Bộ lọc ───────────
  function options(sel, label, values, current) {
    var uniq = values.filter(function (v, i, a) { return v && a.indexOf(v) === i; }).sort(natural);
    sel.innerHTML = '<option value="">' + esc(label) + '</option>' + uniq.map(function (v) {
      return '<option' + (v === current ? ' selected' : '') + ' value="' + esc(v) + '">' + esc(v) + '</option>';
    }).join('');
  }
  function buildFilterOptions() {
    var u = state.units, f = state.filter;
    $('fSource').innerHTML = '<option value="">Tất cả giỏ</option>' + state.data.sources.map(function (s) {
      return '<option value="' + esc(s.key) + '"' + (s.key === f.source ? ' selected' : '') + '>' + esc(s.label) + ' (' + s.count + ')</option>';
    }).join('');
    options($('fZone'), 'Tất cả phân khu', u.map(function (x) { return x.zone; }), f.zone);
    options($('fType'), 'Tất cả loại căn', u.map(function (x) { return x.type; }), f.type);
    options($('fHandover'), 'Tất cả TCBG', u.map(function (x) { return x.handover; }), f.handover);
  }
  ['fSource', 'fZone', 'fType', 'fHandover'].forEach(function (id) {
    var key = { fSource: 'source', fZone: 'zone', fType: 'type', fHandover: 'handover' }[id];
    $(id).onchange = function () { state.filter[key] = this.value; render(); };
  });
  var qTimer;
  $('q').oninput = function () { var v = this.value; clearTimeout(qTimer); qTimer = setTimeout(function () { state.filter.q = v; render(); }, 150); };
  $('fMin').oninput = function () { state.filter.min = this.value; render(); };
  $('fMax').oninput = function () { state.filter.max = this.value; render(); };
  $('reloadBtn').onclick = function () { load(true).then(function () { toast('Đã tải lại từ Google Sheet'); }); };
  $('exportBtn').onclick = exportCsv;

  function baseFiltered() {
    var f = state.filter, q = norm(f.q).trim();
    var min = f.min !== '' ? Number(f.min) * 1e9 : null, max = f.max !== '' ? Number(f.max) * 1e9 : null;
    return state.units.filter(function (u) {
      if (f.source && u.sourceKey !== f.source) return false;
      if (f.zone && u.zone !== f.zone) return false;
      if (f.type && u.type !== f.type) return false;
      if (f.handover && u.handover !== f.handover) return false;
      if (min != null && !(u.priceTotal >= min)) return false;
      if (max != null && !(u.priceTotal <= max)) return false;
      if (q) {
        var hay = norm([u.code, u.zone, u.street, u.type, u.partner, u.note, u.stk, u.statusRaw].join(' '));
        if (q.split(/\s+/).some(function (w) { return hay.indexOf(w) < 0; })) return false;
      }
      return true;
    });
  }

  // ─────────── Hiển thị ───────────
  var COLS = [
    { k: 'code', l: 'Mã căn' }, { k: 'status', l: 'Tình trạng' }, { k: 'zone', l: 'Phân khu' }, { k: 'street', l: 'Đường' },
    { k: 'type', l: 'Loại' }, { k: 'handover', l: 'TCBG' }, { k: 'land', l: 'DT đất', num: 1 }, { k: 'build', l: 'DTXD', num: 1 },
    { k: 'priceTotal', l: 'Giá gồm VAT + KPBT', num: 1 }, { k: 'stk', l: 'STK / Đối tác' }, { k: 'sourceLabel', l: 'Giỏ' }, { k: 'note', l: 'Ghi chú' }
  ];

  function render() {
    var base = baseFiltered();
    renderKpis(base);
    var rows = state.filter.status ? base.filter(function (u) { return u.status === state.filter.status; }) : base;
    var s = state.sort;
    rows = rows.slice().sort(function (a, b) {
      var r;
      if (s.key === 'status') r = rank(a.status) - rank(b.status);
      else if (['land', 'build', 'priceTotal'].indexOf(s.key) >= 0) r = (a[s.key] == null ? Infinity : a[s.key]) - (b[s.key] == null ? Infinity : b[s.key]);
      else r = natural(a[s.key] || '', b[s.key] || '');
      return (r || natural(a.code, b.code)) * s.dir;
    });
    $('count').textContent = rows.length + ' / ' + state.units.length + ' căn';
    $('thead').innerHTML = '<tr>' + COLS.map(function (c) {
      var arrow = s.key === c.k ? (s.dir > 0 ? ' ▲' : ' ▼') : '';
      return '<th data-k="' + c.k + '"' + (c.num ? ' class="num"' : '') + '>' + esc(c.l) + arrow + '</th>';
    }).join('') + '</tr>';
    if (!rows.length) {
      $('tbody').innerHTML = '<tr><td colspan="' + COLS.length + '"><div class="empty">Không có căn phù hợp bộ lọc.</div></td></tr>';
      $('cards').innerHTML = '<div class="empty">Không có căn phù hợp bộ lọc.</div>';
      state.visible = rows; return;
    }
    $('tbody').innerHTML = rows.map(function (u) {
      return '<tr data-key="' + esc(u.key) + '" class="' + (u.status === ST.SOLD ? 'sold' : '') + '">' +
        '<td class="code">' + esc(u.code) + '</td><td>' + chip(u.status) + '</td><td>' + esc(u.zone) + '</td><td>' + esc(u.street) + '</td>' +

      data[pid].forEach(function (u) { keys[u.sourceKey] = keys[u.sourceKey] || { key: u.sourceKey, label: u.sourceLabel, editable: u.editable, count: 0, error: '', statusMode: 'column', legend: {} }; keys[u.sourceKey].count++; });
      return Object.keys(keys).map(function (k) { return keys[k]; });
    }
    return {
      apiBootstrap: function () { return boot; },
      apiGetInventory: function (pid) { return JSON.parse(JSON.stringify({ projectId: pid, units: data[pid], sources: sources(pid), updatedAt: new Date().toISOString() })); },
      apiGetReference: function (pid, sheet) { return { sheet: sheet, rows: refs[sheet] || [] }; },
      apiCheckPin: function (p) { return p === pin; },
      apiUpdateUnit: function (p) {
        if (p.pin !== pin) throw new Error('Mã PIN không đúng.');
        var u = data[p.projectId].filter(function (x) { return x.sourceKey === p.sourceKey && x.code === p.code; })[0];
        if (!u) throw new Error('Không tìm thấy căn.');
        if (!u.editable) throw new Error('Giỏ này chỉ xem.');
        Object.keys(p.changes).forEach(function (f) {
          log.unshift([new Date().toLocaleString('vi-VN'), p.user, p.sourceKey.split(':')[1], u.code, f, f === 'status' ? u.status : u[f], p.changes[f]]);
          u[f] = p.changes[f]; if (f === 'status') u.statusRaw = p.changes[f];
        });
        return { ok: true };
      },
      apiGetLog: function () { return log; }
    };
  })();
})();
</script>
