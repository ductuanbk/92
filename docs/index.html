<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng hàng Vinhomes Saigon Park, Vinhomes Green Paradise | Á Đông Land</title>
<meta name="description" content="Bảng giá tham khảo các căn Vinhomes Saigon Park và Vinhomes Green Paradise do Á Đông Land tư vấn. Lọc theo phân khu, loại hình, diện tích, giá.">
<meta property="og:title" content="Bảng hàng Vinhomes Saigon Park, Vinhomes Green Paradise | Á Đông Land">
<meta property="og:description" content="Bảng giá tham khảo, cập nhật từ giỏ hàng Á Đông Land. Lọc theo phân khu, loại hình, diện tích, giá.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
  :root { --brand: #a31d24; --navy: #0b1f4b; --ink: #2b3445; --muted: #8a94a6; --line: #eef0f4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); font: 14px/1.5 "Be Vietnam Pro", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: var(--brand); }
  .top { border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 10; }
  .top .in { max-width: 1560px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 16px; }
  .logo { font-weight: 800; color: var(--brand); letter-spacing: .3px; line-height: 1.15; }
  .logo small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: 0; }
  .spacer { flex: 1; }
  .call { background: var(--brand); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
  .call.ghost { background: #fff; color: var(--navy); border: 1px solid #d9dee7; }
  main { max-width: 1560px; margin: 0 auto; padding: 18px 24px 60px; }
  .hero { background: linear-gradient(180deg, #f1f2f4, #f8f8f9); border-radius: 12px; padding: 28px 24px; box-shadow: 0 2px 10px rgba(16,24,40,.06); margin-bottom: 18px; }
  .hero h1 { margin: 0 0 10px; color: var(--navy); font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: -.2px; }
  .hero p { margin: 0; color: #1f2937; }
  .notice { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; background: #fdf2dc; color: #8a5a00; border: 1px solid #f0d9a6; }
  footer { border-top: 1px solid var(--line); background: #fafbfc; }
  footer .in { max-width: 1560px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; color: #4a5468; font-size: 13px; }
  footer b { color: var(--navy); }
  .tagline { color: var(--brand); font-weight: 600; margin-top: 6px; }
  @media (max-width: 900px) {
    .top .in, main { padding-left: 12px; padding-right: 12px; }
    .hero { padding: 18px 16px; } .hero h1 { font-size: 20px; }
    footer .in { grid-template-columns: 1fr; }
    .call.ghost { display: none; }
  }
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="logo">Á ĐÔNG LAND<small>Bảng hàng dự án</small></div>
  <span class="spacer"></span>
  <a class="call ghost" id="zaloTop" target="_blank" rel="noopener">Nhắn Zalo</a>
  <a class="call" id="callTop"></a>
</div></div>

<main>
  <div id="notice"></div>
  <section class="hero">
    <h1 id="heroTitle">Bảng hàng</h1>
    <p id="heroDesc">Đang tải bảng hàng...</p>
  </section>
  <!-- Khối bảng hàng: cùng mã với khối nhúng trên adongland.vn -->
  <div data-adl-bang-hang data-tieu-de="0"></div>
</main>

<footer><div class="in">
  <div>
    <b id="fName"></b><br>
    <span id="fAddr"></span><br>
    Mã số thuế: <span id="fTax"></span><br>
    <div class="tagline">Lựa chọn sáng suốt. Giá trị bền vững.</div>
  </div>
  <div>
    <b>Tư vấn dự án</b><br>
    Hotline: <a id="fCall"></a><br>
    Zalo: <a id="fZalo" target="_blank" rel="noopener">Nhắn tin tư vấn</a>
  </div>
</div></footer>

<script src="config.js"></script>
<script>
(function () {
  var C = window.ADL_SITE, $ = function (id) { return document.getElementById(id); };
  var tel = 'tel:' + C.hotline;
  $('callTop').href = tel; $('callTop').textContent = 'Gọi ' + C.hotlineText;
  $('zaloTop').href = C.zalo; $('fZalo').href = C.zalo;
  $('fCall').href = tel; $('fCall').textContent = C.hotlineText;
  $('fName').textContent = C.company.name; $('fAddr').textContent = C.company.address; $('fTax').textContent = C.company.taxCode;
  document.addEventListener('adl:update', function (e) {
    var d = e.detail, t = new Date(d.updatedAt);
    var upd = t.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ngày ' + t.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    $('heroTitle').textContent = 'Bảng hàng ' + d.project.name;
    $('heroDesc').textContent = 'Bảng giá tham khảo các căn ' + d.project.name + ' do Á Đông Land tư vấn. Cập nhật lúc ' + upd + '.';
    document.title = 'Bảng hàng ' + d.project.name + ' | Á Đông Land';
    $('notice').innerHTML = d.demo ? '<div class="notice">Đang xem <b>dữ liệu minh họa</b>, không phải bảng hàng thật.</div>' : '';
  });
  setTimeout(function () {
    if ($('heroDesc').textContent.indexOf('Đang tải') === 0) $('heroDesc').textContent = 'Bảng hàng đang được cập nhật. Vui lòng gọi ' + C.hotlineText + ' để nhận giỏ hàng mới nhất.';
  }, 26000);
})();
</script>
<script src="embed.js"></script>
</body>
</html>
